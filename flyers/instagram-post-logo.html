<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SBP Grand Opening — Instagram Post, Logo Version (1080×1350)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #9a9488; }
  .post {
    width: 1080px; height: 1350px; margin: 0 auto; background: #F5F0E8;
    font-family: 'Inter', sans-serif; color: #2C2A25;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .photo { position: relative; height: 420px; overflow: hidden; flex-shrink: 0; }
  .photo img.bg { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo .fade {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(245,240,232,0) 50%, rgba(245,240,232,1) 100%);
  }

  .content {
    padding: 10px 70px 0; text-align: center; flex: 1;
    display: flex; flex-direction: column; align-items: center;
  }
  .eyebrow {
    font-size: 26px; letter-spacing: 0.42em; text-transform: uppercase;
    color: #9A6B42; font-weight: 600;
  }
  .biglogo { margin-top: 16px; }
  .biglogo img { height: 350px; }
  .times {
    font-family: 'Cormorant Garamond', serif; font-size: 62px; font-weight: 600;
    color: #2C2A25; margin-top: 18px; line-height: 1.15;
  }
  .divider { width: 240px; height: 2px; background: #C4956A; margin: 24px auto; }
  .details {
    font-size: 31px; line-height: 1.8; color: #5C5850;
  }
  .details strong { color: #2C2A25; font-weight: 600; }
  .details .addr { font-size: 27px; }
  .base-strip {
    display: flex; align-items: center; justify-content: center; gap: 22px;
    margin-top: 26px;
    font-size: 21px; letter-spacing: 0.28em; text-transform: uppercase;
    color: #9A9488; font-weight: 600;
  }
  .base-strip img { height: 56px; }
  .footer {
    margin-top: auto; padding: 20px 70px 40px; text-align: center;
    font-size: 27px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #0E5C6A; font-weight: 600;
  }
</style>
</head>
<body>
<div class="post">
  <div class="photo">
    <img class="bg" src="../public/homepage-sub.png" alt="">
    <div class="fade"></div>
  </div>

  <div class="content">
    <div class="eyebrow">Grand Opening</div>

    <div class="biglogo">
      <img src="../public/sbp-logo.png" alt="Santa Barbara Pilates">
    </div>

    <div class="times">Saturday, July 18<br>10 AM – 2 PM</div>
    <div class="divider"></div>

    <div class="details">
      <strong>Studio Tour • Inspiration • Food and Drinks!</strong><br>
      <span class="addr">123 Santa Barbara St · The Funk Zone</span>
    </div>

    <div class="base-strip">
      Celebrating the reopening of
      <img src="../public/base-logo.jpeg" alt="The Base">
    </div>
  </div>

  <div class="footer">santabarbarapilates.com</div>
</div>
</body>
</html>
