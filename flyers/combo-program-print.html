<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Perfect Combo — print / light version</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #9a9488; }

  /* Light / low-ink version: white ground, dark type. */
  .post {
    width: 1080px; height: 1350px; margin: 0 auto; background: #FFFFFF;
    font-family: 'Inter', sans-serif; color: #2C2A25;
    display: flex; flex-direction: column; overflow: hidden;
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }

  .head {
    background: transparent;
    padding: 60px 70px 8px; text-align: center; color: #2C2A25;
  }
  .head h1 {
    font-weight: 700; font-size: 66px; line-height: 1.02;
    letter-spacing: -0.02em; margin-top: 0;
  }
  .head .sub {
    font-size: 26px; font-weight: 300; color: #5C5850;
    margin-top: 16px; letter-spacing: 0.01em;
  }

  .body {
    flex: 1; padding: 26px 60px;
    display: flex; flex-direction: column; justify-content: center;
  }

  /* Feather divider between the title and the photos */
  .feather { display: block; width: 300px; height: auto; margin: 0 auto 40px; }

  /* Photo row — square so people aren't cropped */
  .chain { display: flex; gap: 16px; }
  .col { flex: 1; display: flex; flex-direction: column; }
  .col img {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    border: 1px solid #E2DDD6;
  }
  .col .cap {
    text-align: center; margin-top: 22px;
    font-weight: 600; font-size: 30px; line-height: 1.1;
    letter-spacing: -0.01em; color: #2C2A25;
  }

  .lede {
    margin: 46px auto 0; max-width: 880px; text-align: center;
    font-size: 25px; line-height: 1.55; color: #5C5850; font-weight: 300;
  }
  .lede b { color: #2C2A25; font-weight: 600; }

  .cadence {
    text-align: center; margin-top: 34px;
    font-size: 19px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #9A6B42; font-weight: 600;
  }

  .qr {
    margin-top: 32px; display: flex; flex-direction: column; align-items: center;
  }
  .qr img { width: 170px; height: 170px; display: block; }

  /* No ink-heavy bar — the logos are dark artwork and read on white. */
  .footer {
    background: transparent; padding: 20px 70px 40px;
    display: flex; align-items: center; justify-content: center; gap: 56px;
  }
  .footer img.base { height: 90px; }
  .footer img.sbp { height: 176px; }
</style>
</head>
<body>
<div class="post">
  <div class="head">
    <h1>The Perfect Combo.</h1>
    <div class="sub">Strength, core, mobility &amp; recovery — all in one.</div>
  </div>

  <div class="body">
    <img class="feather" src="feather-horizontal.png" alt="">
    <div class="chain">
      <div class="col">
        <img src="combo-pilates.png" style="object-position: 40% 45%;" alt="Pilates">
        <div class="cap">Pilates</div>
      </div>
      <div class="col">
        <img src="combo-base.png" style="object-position: 55% 50%;" alt="Personal training">
        <div class="cap">Personal&nbsp;Training</div>
      </div>
      <div class="col">
        <img src="combo-recovery.jpg" style="object-position: 40% 50%;" alt="Recovery">
        <div class="cap">Recovery</div>
      </div>
    </div>

    <p class="lede">
      Come in for <b>1 Pilates session</b> and <b>1 Personal Training session</b> each
      week for four weeks. At the end of each session, enjoy our
      <b>outdoor recovery area</b>.
    </p>

    <div class="cadence">Every week &nbsp;·&nbsp; One combo package</div>

    <div class="qr">
      <img src="combo-qr-print.png" alt="Scan to join">
    </div>
  </div>

  <div class="footer">
    <img class="base" src="../public/base-logo.jpeg" alt="The Base">
    <img class="sbp" src="../public/sbp-logo.png" alt="Santa Barbara Pilates">
  </div>
</div>
</body>
</html>
